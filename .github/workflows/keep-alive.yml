name: Keep Supabase Alive

on:
  schedule:
    # Esegue ogni 2 giorni alle ore 04:00 UTC per garantire che il database non venga mai considerato inattivo
    - cron: '0 4 */2 * *'
  workflow_dispatch: # Permette di testarlo manualmente con un pulsante da GitHub

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://orxvvlgaguekvdnhqqft.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9yeHZ2bGdhZ3Vla3ZkbmhxcWZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MDM1NDQsImV4cCI6MjEwNTQ3OTU0NH0.m2RLp51PV_-v3T3zgmsZmMyh7ecy_8K_CUIptsyAReQ' }}
        run: |
          echo "Sending keep-alive ping to Supabase..."
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/employees?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          
          echo "Supabase responded with HTTP status: $RESPONSE_CODE"
          
          if [ "$RESPONSE_CODE" -ge 200 ] && [ "$RESPONSE_CODE" -lt 300 ]; then
            echo "✅ Ping riuscito con successo! Il database rimarrà attivo."
          else
            echo "⚠️ Attenzione: risposta inattesa ($RESPONSE_CODE)."
            exit 1
          fi
